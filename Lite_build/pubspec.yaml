name: colourswift_av
description: AvarionX Security - antivirus suite (lite)
publish_to: "none"
version: 4.0.6+11548
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.4
  permission_handler: ^11.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  percent_indicator: ^4.2.3
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  file_picker: ^8.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  installed_apps: ^2.0.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  device_apps: ^2.2.0
  usage_stats: ^1.3.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  receive_intent: ^0.2.7
  package_info_plus: ^8.0.0
  device_info_plus: ^12.2.0
  android_intent_plus: ^4.0.3
  in_app_purchase: ^3.2.0
  crypto: ^3.0.3
  workmanager: ^0.9.0+3
  battery_plus: ^6.0.2
  app_links: ^6.3.2
  flutter_svg: ^2.0.10


dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  device_apps:
    path: plugins/device_apps-2.2.0
  usage_stats:
    path: plugins/usage_stats-fixed

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/defs/
    - assets/illustrations/thumbs_up_stickman.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  remove_alpha_ios: true
