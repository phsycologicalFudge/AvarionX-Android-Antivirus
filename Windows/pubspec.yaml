name: AvarionX
description: AvarionX Desktop Security Client
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  percent_indicator: ^4.2.3
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  file_picker: ^8.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  usage_stats: ^1.3.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  receive_intent: ^0.2.7
  crypto: ^3.0.3
  workmanager: ^0.9.0+3
  battery_plus: ^6.0.2

dev_dependencies:
